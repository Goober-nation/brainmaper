services:
  mongo:
    image: mongo:7
    container_name: brainmap-db
    logging:
      driver: "none"  # This natively blocks ALL logs from hitting Docker
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${DB_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mongo_data:/data/db
    ports:
      - "${POSTGRES_EXTERNAL_PORT:-27017}:27017"

  backend:
    build: ./backend
    container_name: brainmap-go-backend
    depends_on:
      - mongo
    environment:
      DB_HOST: mongo
      DB_PORT: 27017
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      CONTEXT_DEPTH: ${CONTEXT_DEPTH}
      GEMINI_MODEL: ${GEMINI_MODEL}
    volumes:
      - ./backend/data:/app/data
    ports:
      - "${BACKEND_EXTERNAL_PORT}:8080"

  frontend:
    build: ./frontend
    container_name: brainmap-react-frontend
    depends_on:
      - backend
    ports:
      - "${FRONTEND_EXTERNAL_PORT}:80"

volumes:
  mongo_data: